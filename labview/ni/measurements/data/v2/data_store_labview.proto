//
// Use this file only to generate LabVIEW gRPC clients with grpc-labview.
// Do not use it for servers or other clients. The canonical proto is the
// source of truth; re-derive this file whenever the canonical proto changes.
//
// Wire-compatible with the canonical contract: same package, services,
// RPCs, messages, field numbers, and wire types, except:
//   - google.protobuf.Struct fields are bytes at the same field number:
//     JsonValue.value (1), Measurement.extension (18),
//     TestResult.extension (16), Step.extension (14).
//   - Step.children (26) is reserved; rebuild hierarchy with parent_step_id.
//   - TestResult.uut_instance, operator, test_station, test_description, uut
//     (26-30) and Step.test (27) are reserved; use the matching *_id fields.

syntax = "proto3";

package ni.measurements.data.v2;

import "ni/datamonikers/v1/data_moniker.proto";
import "ni/measurements/metadata/v1/metadata_store.proto";
import "ni/protobuf/types/attribute_value.proto";
import "ni/protobuf/types/precision_duration.proto";
import "ni/protobuf/types/precision_timestamp.proto";
import "ni/protobuf/types/scalar.proto";
import "ni/protobuf/types/vector.proto";
import "ni/protobuf/types/waveform.proto";
import "ni/protobuf/types/xydata.proto";

option csharp_namespace = "NationalInstruments.Measurements.Data.V2";
option go_package = "datav2";
option java_multiple_files = true;
option java_outer_classname = "DataStoreProto";
option java_package = "com.ni.measurements.data.v2";
option objc_class_prefix = "NIMD2";
option php_namespace = "NI\\Measurements\\Data\\V2";
option ruby_package = "NI::Measurements::Data::V2";

// Represents error details reported by a resource producer.
message ErrorInformation {
  int32 error_code = 1;
  string message = 2;
  string source = 3;
}

// Represents structured JSON data
message JsonValue {
  // Required. The JSON content.
  // LabVIEW companion: google.protobuf.Struct in the canonical contract.
  // Carries the serialized Struct message bytes, not JSON text.
  bytes value = 1;
  // Reserved for a schema associated with the JSON content. Schema validation
  // is not implemented for the preview; requests that set this field fail.
  string schema_id = 2;
  // Optional. Metadata attached to the complete JSON value.
  map<string, ni.protobuf.types.AttributeValue> attributes = 3;
}

// Represents a condition value.
message ConditionValue {
  oneof value {
    ni.protobuf.types.Scalar scalar = 1;
    JsonValue json_value = 2;
  }
}

// Represents an immutable operational condition value associated with a Step.
// Conditions are not updated in place. AddCondition with the same name and a
// different value replaces the Step's association with another Condition value.
message Condition {
  // Required. Immutable and unique within a Step by exact, case-sensitive name.
  string name = 1;
  // Optional. Immutable.
  string condition_type = 2;
  // Required. Immutable.
  ConditionValue value = 3;
  // Optional. Immutable.
  string value_label = 4;
  // Optional. Immutable.
  string units = 5;
}

// Represents inline measurement data or a reference to externally stored data.
message MeasurementValue {
  oneof value {
    ni.datamonikers.v1.Moniker data_moniker = 1;
    ni.protobuf.types.Scalar scalar = 2;
    ni.protobuf.types.Vector vector = 3;
    ni.protobuf.types.DoubleAnalogWaveform double_analog_waveform = 4;
    ni.protobuf.types.DoubleXYData x_y_data = 5;
    ni.protobuf.types.I16AnalogWaveform i16_analog_waveform = 6;
    ni.protobuf.types.DoubleComplexWaveform double_complex_waveform = 7;
    ni.protobuf.types.I16ComplexWaveform i16_complex_waveform = 8;
    ni.protobuf.types.DoubleSpectrum double_spectrum = 9;
    ni.protobuf.types.DigitalWaveform digital_waveform = 10;
    ni.protobuf.types.FloatAnalogWaveform float_analog_waveform = 11;
    ni.protobuf.types.FloatComplexWaveform float_complex_waveform = 12;
    ni.protobuf.types.FloatSpectrum float_spectrum = 13;
    JsonValue json_value = 14;
  }
}

// Represents one scalar, vector, waveform, XY, spectrum, digital, or JSON
// measurement. A data moniker can reference values without an inline type.
message Measurement {
  // Optional on create. When provided, must be a lowercase, hyphenated,
  // non-nil UUID; otherwise the service generates a UUIDv4. Output contains
  // the canonical V2 resource identifier. Required on update. Immutable.
  string id = 1;
  // Optional when nested as a consistency assertion against a request-known
  // containing TestResult ID; otherwise set from the owning Step.
  string test_result_id = 2;
  // Required when created directly. When nested, may assert a request-known
  // containing Step ID; otherwise set from the owning Step. Immutable.
  string step_id = 3;
  // Required. Immutable.
  string name = 4;
  // Output only. The service-generated measurement value type.
  string value_type = 5;
  // Required. Immutable.
  MeasurementValue value = 6;
  // Optional. Immutable engineering units for the scalar or primary value.
  string units = 7;
  // Optional. Immutable.
  MeasurementValue upper_limit = 8;
  // Optional. Immutable.
  MeasurementValue lower_limit = 9;
  // Optional on create. Use AddMeasurementMetadata or
  // RemoveMeasurementMetadata after creation; UpdateMeasurement rejects this
  // field in an update mask.
  repeated string software_item_ids = 10;
  // Optional on create. Use AddMeasurementMetadata or
  // RemoveMeasurementMetadata after creation; UpdateMeasurement rejects this
  // field in an update mask.
  repeated string hardware_item_ids = 11;
  // Optional on create. Use AddMeasurementMetadata or
  // RemoveMeasurementMetadata after creation; UpdateMeasurement rejects this
  // field in an update mask.
  repeated string test_adapter_ids = 12;
  // Optional.
  string notes = 13;
  // Optional.
  ni.protobuf.types.PrecisionTimestamp start_date_time = 14;
  // Optional.
  ni.protobuf.types.PrecisionTimestamp end_date_time = 15;
  // Optional.
  Outcome outcome = 16;
  // Optional.
  ErrorInformation error_information = 17;
  // Optional. Open custom data; values may be any JSON kind. An update that
  // selects this field replaces the whole value.
  // LabVIEW companion: google.protobuf.Struct in the canonical contract.
  // Carries the serialized Struct message bytes, not JSON text.
  bytes extension = 18;
  // Reserved for a future schema associated with the extension. Must be empty.
  string schema_id = 19;
  // Optional. Stored at microsecond precision; additional precision is dropped.
  // When exactly two of start_date_time, end_date_time, and duration are set,
  // the service derives the missing value. Fewer values are accepted as given.
  // If all three are set, they are preserved without checking that they agree.
  // Timing on the owning Step or TestResult does not update this Measurement.
  ni.protobuf.types.PrecisionDuration duration = 20;
  // Output only. Conditions copied from the owning Step.
  repeated Condition conditions = 21;
  // Output only.
  ni.protobuf.types.PrecisionTimestamp created_at = 22;
  // Output only.
  ni.protobuf.types.PrecisionTimestamp updated_at = 23;
  // Output only.
  string created_by = 24;
  // Output only.
  string updated_by = 25;
  // Optional. On create, find or create these items and merge their IDs with
  // software_item_ids, removing duplicates. Populated on reads only when
  // requested by read_mask or OData expansion.
  repeated ni.measurements.metadata.v1.SoftwareItem software_items = 26;
  // Optional. On create, find or create these items and merge their IDs with
  // hardware_item_ids, removing duplicates. Populated on reads only when
  // requested by read_mask or OData expansion.
  repeated ni.measurements.metadata.v1.HardwareItem hardware_items = 27;
  // Optional. On create, find or create these items and merge their IDs with
  // test_adapter_ids, removing duplicates. Populated on reads only when
  // requested by read_mask or OData expansion.
  repeated ni.measurements.metadata.v1.TestAdapter test_adapters = 28;
  // Optional. Immutable publisher-defined comparison operation. The service
  // stores this value as provenance and does not derive Outcome from it.
  string comparison_type = 29;
}

// Represents one execution of a test process.
message TestResult {
  // Optional on create. When provided, must be a lowercase, hyphenated,
  // non-nil UUID; otherwise the service generates a UUIDv4. Output contains
  // the canonical V2 resource identifier. Required on update. Immutable.
  string id = 1;
  // Optional. Accepts an existing metadata identifier or alias.
  string uut_instance_id = 2;
  // Optional. Accepts an existing metadata identifier or alias.
  string operator_id = 3;
  // Optional. Accepts an existing metadata identifier or alias.
  string test_station_id = 4;
  // Optional. Accepts an existing metadata identifier or alias.
  string test_description_id = 5;
  // Optional on create. Use AddTestResultMetadata or RemoveTestResultMetadata
  // after creation; UpdateTestResult rejects this field in an update mask.
  repeated string software_item_ids = 6;
  // Optional on create. Use AddTestResultMetadata or RemoveTestResultMetadata
  // after creation; UpdateTestResult rejects this field in an update mask.
  repeated string hardware_item_ids = 7;
  // Optional on create. Use AddTestResultMetadata or RemoveTestResultMetadata
  // after creation; UpdateTestResult rejects this field in an update mask.
  repeated string test_adapter_ids = 8;
  // Required. Immutable.
  string name = 9;
  // Optional.
  ni.protobuf.types.PrecisionTimestamp start_date_time = 10;
  // Optional.
  ni.protobuf.types.PrecisionTimestamp end_date_time = 11;
  // Optional.
  Outcome outcome = 12;
  // Optional. A non-unspecified Outcome sets status to STATUS_DONE. A
  // conflicting non-Done status is invalid.
  Status status = 13;
  // Optional.
  ErrorInformation error_information = 14;
  // Optional. A URI associated with the test result.
  string link = 15;
  // Optional. Open custom data; values may be any JSON kind. An update that
  // selects this field replaces the whole value.
  // LabVIEW companion: google.protobuf.Struct in the canonical contract.
  // Carries the serialized Struct message bytes, not JSON text.
  bytes extension = 16;
  // Reserved for a future schema associated with the extension. Must be empty.
  string schema_id = 17;
  // Optional. Direct reference to the UUT product definition.
  string uut_id = 18;
  // Optional. Labels used to classify the test result.
  repeated string keywords = 19;
  // Optional. Stored at microsecond precision; additional precision is dropped.
  // When exactly two of start_date_time, end_date_time, and duration are set,
  // the service derives the missing value. Fewer values are accepted as given.
  // If all three are set, they are preserved without checking that they agree.
  // Timing on child Steps and Measurements does not update this TestResult.
  ni.protobuf.types.PrecisionDuration duration = 20;
  // Output only.
  ni.protobuf.types.PrecisionTimestamp created_at = 21;
  // Output only.
  ni.protobuf.types.PrecisionTimestamp updated_at = 22;
  // Output only.
  string created_by = 23;
  // Output only.
  string updated_by = 24;
  // Input only. Recursively nested Steps created with this TestResult. Use
  // QuerySteps to read the hierarchy as a flat, paged collection.
  repeated Step steps = 25;
  // LabVIEW companion: the singular inline metadata resources are removed
  // because a LabVIEW cluster cannot leave them absent, and an empty inline
  // object next to its ID is rejected by the service. Use uut_instance_id,
  // operator_id, test_station_id, test_description_id, and uut_id (ID or
  // alias) instead.
  reserved 26 to 30;
  reserved "uut_instance", "operator", "test_station", "test_description",
      "uut";
  // Optional. On create, find or create these items and merge their IDs with
  // software_item_ids, removing duplicates. Populated on reads only when
  // requested by read_mask or OData expansion.
  repeated ni.measurements.metadata.v1.SoftwareItem software_items = 31;
  // Optional. On create, find or create these items and merge their IDs with
  // hardware_item_ids, removing duplicates. Populated on reads only when
  // requested by read_mask or OData expansion.
  repeated ni.measurements.metadata.v1.HardwareItem hardware_items = 32;
  // Optional. On create, find or create these items and merge their IDs with
  // test_adapter_ids, removing duplicates. Populated on reads only when
  // requested by read_mask or OData expansion.
  repeated ni.measurements.metadata.v1.TestAdapter test_adapters = 33;
}

// Represents one execution of a test step.
message Step {
  // Optional on create. When provided, must be a lowercase, hyphenated,
  // non-nil UUID; otherwise the service generates a UUIDv4. Output contains
  // the canonical V2 resource identifier. Required on update. Immutable.
  string id = 1;
  // Optional. When nested, may assert a request-known containing parent Step
  // ID; otherwise set from the containing parent. Immutable. The parent Step
  // must belong to the same TestResult.
  string parent_step_id = 2;
  // Required when created directly. When nested, may assert a request-known
  // containing TestResult ID; otherwise set from the owning TestResult.
  // Immutable.
  string test_result_id = 3;
  // Optional. Accepts an existing metadata identifier or alias.
  string test_id = 4;
  // Required. Immutable.
  string name = 5;
  // Optional. Immutable free-form classification.
  string step_type = 6;
  // Optional.
  string notes = 7;
  // Optional.
  ni.protobuf.types.PrecisionTimestamp start_date_time = 8;
  // Optional.
  ni.protobuf.types.PrecisionTimestamp end_date_time = 9;
  // Optional.
  Outcome outcome = 10;
  // Optional. A non-unspecified Outcome sets status to STATUS_DONE. A
  // conflicting non-Done status is invalid.
  Status status = 11;
  // Optional.
  ErrorInformation error_information = 12;
  // Optional. A URI associated with the step.
  string link = 13;
  // Optional. Open custom data; values may be any JSON kind. TestStand
  // integrations may store code-module inputs, outputs, and additional results
  // here when they are not represented as Conditions or Measurements. An update
  // that selects this field replaces the whole value.
  // LabVIEW companion: google.protobuf.Struct in the canonical contract.
  // Carries the serialized Struct message bytes, not JSON text.
  bytes extension = 14;
  // Reserved for a future schema associated with the extension. Must be empty.
  string schema_id = 15;
  // Optional. Labels used to classify the step.
  repeated string keywords = 16;
  // Optional. Stored at microsecond precision; additional precision is dropped.
  // When exactly two of start_date_time, end_date_time, and duration are set,
  // the service derives the missing value. Fewer values are accepted as given.
  // If all three are set, they are preserved without checking that they agree.
  // This duration does not update or validate against the parent Step or
  // TestResult duration. Child timing does not update this Step.
  ni.protobuf.types.PrecisionDuration duration = 17;
  // Output only. Step-name path including this step.
  repeated string path = 18;
  // Output only. Step-identifier path including this step.
  repeated string path_ids = 19;
  // Output only.
  ni.protobuf.types.PrecisionTimestamp created_at = 20;
  // Output only.
  ni.protobuf.types.PrecisionTimestamp updated_at = 21;
  // Output only.
  string created_by = 22;
  // Output only.
  string updated_by = 23;
  // Input on create and output when explicitly requested. Use AddCondition and
  // RemoveCondition to modify existing conditions.
  repeated Condition conditions = 24;
  // Input on create and output when explicitly requested. Use Measurement
  // methods to modify existing measurements.
  repeated Measurement measurements = 25;
  // LabVIEW companion: children is removed because Step would contain Step,
  // which grpc-labview cannot generate. Create child Steps flat with
  // parent_step_id instead.
  reserved 26;
  reserved "children";
  // LabVIEW companion: the inline test resource is removed because a LabVIEW
  // cluster cannot leave it absent. Use test_id (ID or alias) instead.
  reserved 27;
  reserved "test";
  // Output only. True once this Step has committed at least one direct child.
  // The service manages this historical value and does not clear it after
  // deletion.
  bool has_children = 28;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_PASSED = 1;
  OUTCOME_FAILED = 2;
  OUTCOME_SKIPPED = 3;
  OUTCOME_TERMINATED = 4;
  OUTCOME_ERRORED = 5;
  OUTCOME_TIMED_OUT = 6;
  OUTCOME_USER_DEFINED = 7;
}

// Represents lifecycle progress independently from a terminal Outcome.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_NOT_STARTED = 1;
  STATUS_LOOPING = 2;
  STATUS_RUNNING = 3;
  STATUS_WAITING = 4;
  STATUS_DONE = 5;
}
