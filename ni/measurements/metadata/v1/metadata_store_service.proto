syntax = "proto3";

package ni.measurements.metadata.v1;

import "ni/measurements/metadata/v1/metadata_store.proto";

option csharp_namespace = "NationalInstruments.Measurements.Metadata.V1";
option go_package = "metadatav1";
option java_multiple_files = true;
option java_outer_classname = "MetadataStoreServiceProto";
option java_package = "com.ni.measurements.metadata.v1";
option objc_class_prefix = "NIMM";
option php_namespace = "NI\\Measurements\\Metadata\\V1";
option ruby_package = "NI::Measurements::Metadata::V1";

// This service is responsible for storing and retrieving metadata associated with test step measurements.
service MetadataStoreService {
  // Gets the UUT instance associated with the identifier given in the request.
  rpc GetUutInstance(GetUutInstanceRequest) returns (GetUutInstanceResponse);
  // Perform an OData query
  rpc QueryUutInstances(QueryUutInstancesRequest) returns (QueryUutInstancesResponse);
  // Creates a new UUT instance in the metadata store.
  rpc CreateUutInstance(CreateUutInstanceRequest) returns (CreateUutInstanceResponse);
  // Deletes a UutInstance and its aliases, retaining its UUT and sibling instances.
  // Returns NOT_FOUND if the UutInstance does not exist, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc DeleteUutInstance(DeleteUutInstanceRequest) returns (DeleteUutInstanceResponse);
  // Deletes UutInstances and their aliases without deleting their UUTs.
  // Returns NOT_FOUND for a missing UutInstance, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc BatchDeleteUutInstances(BatchDeleteUutInstancesRequest) returns (BatchDeleteUutInstancesResponse);

  // Gets the UUT associated with the identifier given in the request.
  rpc GetUut(GetUutRequest) returns (GetUutResponse);
  // Perform an OData query
  rpc QueryUuts(QueryUutsRequest) returns (QueryUutsResponse);
  // Creates a new UUT in the metadata store.
  rpc CreateUut(CreateUutRequest) returns (CreateUutResponse);
  // Deletes a UUT and its aliases. With force, also deletes its UutInstances.
  // Returns NOT_FOUND if the UUT does not exist, or FAILED_PRECONDITION
  // if references or owned instances prevent deletion.
  rpc DeleteUut(DeleteUutRequest) returns (DeleteUutResponse);
  // Deletes UUTs and their aliases. Forced requests also delete their UutInstances.
  // Returns NOT_FOUND for a missing UUT, or FAILED_PRECONDITION
  // if references or owned instances prevent deletion.
  rpc BatchDeleteUuts(BatchDeleteUutsRequest) returns (BatchDeleteUutsResponse);

  // Gets the operator associated with the identifier given in the request.
  rpc GetOperator(GetOperatorRequest) returns (GetOperatorResponse);
  // Perform an OData query
  rpc QueryOperators(QueryOperatorsRequest) returns (QueryOperatorsResponse);
  // Creates a new operator in the metadata store.
  rpc CreateOperator(CreateOperatorRequest) returns (CreateOperatorResponse);
  // Deletes an Operator and its aliases.
  // Returns NOT_FOUND if the Operator does not exist, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc DeleteOperator(DeleteOperatorRequest) returns (DeleteOperatorResponse);
  // Deletes Operators and their aliases using each request's force setting.
  // Returns NOT_FOUND for a missing Operator, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc BatchDeleteOperators(BatchDeleteOperatorsRequest) returns (BatchDeleteOperatorsResponse);

  // Gets the test description associated with the identifier given in the request.
  rpc GetTestDescription(GetTestDescriptionRequest) returns (GetTestDescriptionResponse);
  // Perform an OData query
  rpc QueryTestDescriptions(QueryTestDescriptionsRequest) returns (QueryTestDescriptionsResponse);
  // Creates a new test description in the metadata store.
  rpc CreateTestDescription(CreateTestDescriptionRequest) returns (CreateTestDescriptionResponse);
  // Deletes a TestDescription and its aliases.
  // Returns NOT_FOUND if the TestDescription does not exist, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc DeleteTestDescription(DeleteTestDescriptionRequest) returns (DeleteTestDescriptionResponse);
  // Deletes TestDescriptions and their aliases using each request's force setting.
  // Returns NOT_FOUND for a missing TestDescription, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc BatchDeleteTestDescriptions(BatchDeleteTestDescriptionsRequest) returns (BatchDeleteTestDescriptionsResponse);

  // Gets the test associated with the identifier given in the request.
  rpc GetTest(GetTestRequest) returns (GetTestResponse);
  // Perform an OData query
  rpc QueryTests(QueryTestsRequest) returns (QueryTestsResponse);
  // Creates a new test in the metadata store.
  rpc CreateTest(CreateTestRequest) returns (CreateTestResponse);
  // Deletes a Test and its aliases.
  // Returns NOT_FOUND if the Test does not exist, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc DeleteTest(DeleteTestRequest) returns (DeleteTestResponse);
  // Deletes Tests and their aliases using each request's force setting.
  // Returns NOT_FOUND for a missing Test, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc BatchDeleteTests(BatchDeleteTestsRequest) returns (BatchDeleteTestsResponse);

  // Gets the test station associated with the identifier given in the request.
  rpc GetTestStation(GetTestStationRequest) returns (GetTestStationResponse);
  // Perform an OData query
  rpc QueryTestStations(QueryTestStationsRequest) returns (QueryTestStationsResponse);
  // Creates a new test station in the metadata store.
  rpc CreateTestStation(CreateTestStationRequest) returns (CreateTestStationResponse);
  // Deletes a TestStation and its aliases.
  // Returns NOT_FOUND if the TestStation does not exist, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc DeleteTestStation(DeleteTestStationRequest) returns (DeleteTestStationResponse);
  // Deletes TestStations and their aliases using each request's force setting.
  // Returns NOT_FOUND for a missing TestStation, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc BatchDeleteTestStations(BatchDeleteTestStationsRequest) returns (BatchDeleteTestStationsResponse);

  // Gets the hardware item associated with the identifier given in the request.
  rpc GetHardwareItem(GetHardwareItemRequest) returns (GetHardwareItemResponse);
  // Perform an OData query
  rpc QueryHardwareItems(QueryHardwareItemsRequest) returns (QueryHardwareItemsResponse);
  // Creates a new hardware item in the metadata store.
  rpc CreateHardwareItem(CreateHardwareItemRequest) returns (CreateHardwareItemResponse);
  // Deletes a HardwareItem and its aliases.
  // Returns NOT_FOUND if the HardwareItem does not exist, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc DeleteHardwareItem(DeleteHardwareItemRequest) returns (DeleteHardwareItemResponse);
  // Deletes HardwareItems and their aliases using each request's force setting.
  // Returns NOT_FOUND for a missing HardwareItem, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc BatchDeleteHardwareItems(BatchDeleteHardwareItemsRequest) returns (BatchDeleteHardwareItemsResponse);

  // Gets the software item associated with the identifier given in the request.
  rpc GetSoftwareItem(GetSoftwareItemRequest) returns (GetSoftwareItemResponse);
  // Perform an OData query
  rpc QuerySoftwareItems(QuerySoftwareItemsRequest) returns (QuerySoftwareItemsResponse);
  // Creates a new software item in the metadata store.
  rpc CreateSoftwareItem(CreateSoftwareItemRequest) returns (CreateSoftwareItemResponse);
  // Deletes a SoftwareItem and its aliases.
  // Returns NOT_FOUND if the SoftwareItem does not exist, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc DeleteSoftwareItem(DeleteSoftwareItemRequest) returns (DeleteSoftwareItemResponse);
  // Deletes SoftwareItems and their aliases using each request's force setting.
  // Returns NOT_FOUND for a missing SoftwareItem, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc BatchDeleteSoftwareItems(BatchDeleteSoftwareItemsRequest) returns (BatchDeleteSoftwareItemsResponse);

  // Gets the test adapter associated with the identifier given in the request.
  rpc GetTestAdapter(GetTestAdapterRequest) returns (GetTestAdapterResponse);
  // Perform an OData query
  rpc QueryTestAdapters(QueryTestAdaptersRequest) returns (QueryTestAdaptersResponse);
  // Creates a new test adapter in the metadata store.
  rpc CreateTestAdapter(CreateTestAdapterRequest) returns (CreateTestAdapterResponse);
  // Deletes a TestAdapter and its aliases.
  // Returns NOT_FOUND if the TestAdapter does not exist, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc DeleteTestAdapter(DeleteTestAdapterRequest) returns (DeleteTestAdapterResponse);
  // Deletes TestAdapters and their aliases using each request's force setting.
  // Returns NOT_FOUND for a missing TestAdapter, or FAILED_PRECONDITION
  // if references prevent deletion.
  rpc BatchDeleteTestAdapters(BatchDeleteTestAdaptersRequest) returns (BatchDeleteTestAdaptersResponse);

  // Registers a schema. A registered schema cannot be modified.
  rpc RegisterSchema(RegisterSchemaRequest) returns (RegisterSchemaResponse);
  // Lists the schemas that have been previously registered
  rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse);
  // Deletes a Schema and clears its associations with metadata.
  // The metadata, extension attributes, and aliases are retained.
  // Returns NOT_FOUND if the Schema does not exist.
  rpc DeleteSchema(DeleteSchemaRequest) returns (DeleteSchemaResponse);
  // Deletes Schemas and clears their associations with metadata.
  // The metadata, extension attributes, and aliases are retained.
  // Returns NOT_FOUND for a missing Schema.
  rpc BatchDeleteSchemas(BatchDeleteSchemasRequest) returns (BatchDeleteSchemasResponse);

  // Gets the alias and its target (i.e., the underlying metadata that it represents)
  rpc GetAlias(GetAliasRequest) returns (GetAliasResponse);
  // Perform an OData query on the registered aliases
  rpc QueryAliases(QueryAliasesRequest) returns (QueryAliasesResponse);
  // Creates (registers) an alias of the specified metadata for use/reference when creating other metadata or publishing.
  // Notes:
  // - The specified metadata must have already been created prior to the alias registration.
  // - This method may be called with an already registered alias name in order to update the target mapped for that existing alias.
  rpc CreateAlias(CreateAliasRequest) returns (CreateAliasResponse);
  // Removes an alias without deleting its target metadata.
  // Returns NOT_FOUND if the alias does not exist.
  rpc DeleteAlias(DeleteAliasRequest) returns (DeleteAliasResponse);
  // Removes aliases without deleting their target metadata.
  // Returns NOT_FOUND for a missing alias.
  rpc BatchDeleteAliases(BatchDeleteAliasesRequest) returns (BatchDeleteAliasesResponse);

  // Creates all of the metadata entries contained in the provided JSON document.
  // The JSON document should conform to the schema defined by
  // https://raw.githubusercontent.com/ni/ni-apis/main/ni/measurements/metadata/v1/registration.schema.json
  // The response will contain all of the associated objects from the metadata store.  If the object
  // already exists, the existing object will be returned; otherwise, a new object will be created
  rpc CreateFromJsonDocument(CreateFromJsonDocumentRequest) returns (CreateFromJsonDocumentResponse);
}

// Message sent to get the UUT instance associated with the given identifier.
message GetUutInstanceRequest {
  // Required. The identifier of the desired UUT instance.
  string uut_instance_id = 1;
}

message QueryUutInstancesRequest {
  // an OData query string.  example "$filter=name eq 'Value'"
  // $expand is not supported
  string odata_query = 1;
}

// Message sent to create a new UUT instance in the metadata store.
message CreateUutInstanceRequest {
  // Required. The metadata of the UUT instance to be created.
  UutInstance uut_instance = 1;
}

// Request to delete one UutInstance by UUID.
message DeleteUutInstanceRequest {
  // Required. UUID of the UutInstance to delete; aliases are not accepted.
  string uut_instance_id = 1;
  // If true, removes references while retaining linked test data and the UUT.
  // Otherwise, references prevent deletion.
  bool force = 2;
}

// Request to delete UutInstances using each item's force setting.
message BatchDeleteUutInstancesRequest {
  // Required. UutInstance delete requests with distinct identifiers.
  // Returns INVALID_ARGUMENT if empty or invalid, or RESOURCE_EXHAUSTED if too large.
  repeated DeleteUutInstanceRequest requests = 1;
}

// Message returned when getting a UUT instance associated with the given identifier.
message GetUutInstanceResponse {
  // The metadata of the requested UUT instance.
  UutInstance uut_instance = 1;
}

message QueryUutInstancesResponse {
  repeated UutInstance uut_instances = 1;
}

// Message returned when creating a new UUT instance in the metadata store.
message CreateUutInstanceResponse {
  // The identifier of the created UUT instance.
  string uut_instance_id = 1;
}

// Empty response returned when a UutInstance is deleted successfully.
message DeleteUutInstanceResponse {}

// Empty response returned when all UutInstances are deleted successfully.
message BatchDeleteUutInstancesResponse {}

// Message sent to get the UUT associated with the given identifier.
message GetUutRequest {
  // Required. The identifier of the desired UUT.
  string uut_id = 1;
}

message QueryUutsRequest {
  // an OData query string.  example "$filter=name eq 'Value'"
  // $expand is not supported
  string odata_query = 1;
}

// Message sent to create a new UUT in the metadata store.
message CreateUutRequest {
  // Required. The metadata of the UUT to be created.
  Uut uut = 1;
}

// Request to delete one UUT by UUID.
message DeleteUutRequest {
  // Required. UUID of the UUT to delete; aliases are not accepted.
  string uut_id = 1;
  // If true, also deletes this UUT's instances and removes references to the
  // deleted resources. Related test data and other metadata are retained.
  bool force = 2;
}

// Request to delete UUTs using each item's force setting.
message BatchDeleteUutsRequest {
  // Required. UUT delete requests with distinct identifiers.
  // Returns INVALID_ARGUMENT if empty or invalid, or RESOURCE_EXHAUSTED if too large.
  repeated DeleteUutRequest requests = 1;
}

// Message returned when getting a UUT associated with the given identifier.
message GetUutResponse {
  // The metadata of the requested UUT.
  Uut uut = 1;
}

message QueryUutsResponse {
  repeated Uut uuts = 1;
}

// Message returned when creating a new UUT in the metadata store.
message CreateUutResponse {
  // The identifier of the created UUT.
  string uut_id = 1;
}

// Empty response returned when a UUT is deleted successfully.
message DeleteUutResponse {}

// Empty response returned when all UUTs are deleted successfully.
message BatchDeleteUutsResponse {}

