syntax = "proto3";

package ni.measurements.metadata.v1;

option csharp_namespace = "NationalInstruments.Measurements.Metadata.V1";
option go_package = "metadatav1";
option java_multiple_files = true;
option java_outer_classname = "MetadataStoreProto";
option java_package = "com.ni.measurements.metadata.v1";
option objc_class_prefix = "NIMM";
option php_namespace = "NI\\Measurements\\Metadata\\V1";
option ruby_package = "NI::Measurements::Metadata::V1";

// Represents the metadata of a UUT instance
message UutInstance
{
  // The unique identifier of the UUT instance
  // This value is a string representation of a GUID. It is generated by the metadata store
  // and cannot be set/specified by clients.
  string id = 1;
  // The id of the UUT associated with this UUT instance.
  // This value is expected to be a parsable GUID or an alias. It will always
  // be returned from the service as a GUID.
  // See ni.measurements.metadata.MetadataStoreService for more information.
  string uut_id = 2;
  // The serial number of the UUT instance
  string serial_number = 3;
  // The date the UUT instance was manufactured
  string manufacture_date = 4;
  // Version of the firmware on the UUT instance
  string firmware_version = 5;
  // Hardware version of the UUT instance
  string hardware_version = 6;
  // A link to a resource that describes the UUT instance.
  // This value is expected to be a valid URI.
  string link = 7;
  // Optional. Any attributes used to extend the definition of your UutInstance can go here.
  // In v1, register a schema for extension attributes and specify its ID in schema_id. In v2,
  // association is optional for this metadata resource: schema-less Extension values use open
  // extension rules, while a supplied Schema continues to validate Extension values.
  // Deleting a schema in v2 clears schema_id but retains these values, this resource's ID, and
  // its stored identity keys; subsequent extension writes use schema-less rules.
  map<string, ExtensionValue> extension = 8;
  // In v1, required when extension values are present and must be the ID of a registered schema.
  // In v2, optional for schema-less Extension values; deleting the Schema clears this field
  // without changing Extension values, this resource's ID, or its stored identity keys.
  string schema_id = 9;
}

// Represents the metadata of a UUT
message Uut
{
  // The unique identifier of the UUT
  // This value is a string representation of a GUID. It is generated by the metadata store
  // and cannot be set/specified by clients.
  string id = 1;
  // The name of the UUT model
  string model_name = 2;
  // The UUT family
  string family = 3;
  // List of manufacturers of the UUT
  repeated string manufacturers = 4;
  // The part number of the UUT
  string part_number = 5;
  // A link to a resource that describes the UUT.
  // This value is expected to be a valid URI.
  string link = 6;
  // Optional. Any attributes used to extend the definition of your Uut can go here.
  // In v1, register a schema for extension attributes and specify its ID in schema_id. In v2,
  // association is optional for this metadata resource: schema-less Extension values use open
  // extension rules, while a supplied Schema continues to validate Extension values.
  // Deleting a schema in v2 clears schema_id but retains these values, this resource's ID, and
  // its stored identity keys; subsequent extension writes use schema-less rules.
  map<string, ExtensionValue> extension = 7;
  // In v1, required when extension values are present and must be the ID of a registered schema.
  // In v2, optional for schema-less Extension values; deleting the Schema clears this field
  // without changing Extension values, this resource's ID, or its stored identity keys.
  string schema_id = 8;
}

